      - name: Ecrire bysg_det.h
        run: |
          cat > bysg_det.h <<'BYSG_SRC_END'
          #ifndef BYSG_DET_H
          #define BYSG_DET_H
          #ifdef __cplusplus
          extern "C" {
          #endif
          /* kind : 0 = intro (START), 1 = piece (STOP), 2 = mort (STOP) ; lagMs = retard de detection */
          extern void bysgOnHit(int kind, int lagMs);
          void bysgDetInit(void);
          void bysgDetSetSens(float k);
          void bysgDetSetSensK(int kind, float k);
          void bysgDetStats(float *e, float *w);
          void bysgDetFeed(const float *mono, int n, double rate);
          extern volatile int bysgDetOn;
          #ifdef __cplusplus
          }
          #endif
          #endif
          BYSG_SRC_END
      - name: Ecrire bysg_det.c
        run: |
          cat > bysg_det.c <<'BYSG_SRC_END'
          // Detecteur de sons en 2 etapes sur la sortie audio du jeu :
          //  1) enveloppe d'energie (blocs de 2 ms, controle toutes les 1 ms) : tres leger, insensible a la phase
          //  2) correlation normalisee sur l'onde (fenetre autour du pic) : precis a ~0,02 ms, tres selectif
          #include <stdlib.h>
          #include <string.h>
          #include <math.h>
          #include <stdint.h>
          #include "bysg_det.h"
          #include "bysg_snd.h"

          #define NT 4                 /* 0 intro, 1 piece, 2 mort, 3 intro (secours) */
          #define RING 32768
          #define MASK (RING - 1)
          #define DEC 4                /* anneau a 44100 Hz, gabarits d'onde a 11025 Hz (pas de 4) */
          #define EBLK 88              /* bloc d'enveloppe : 2 ms a 44100 Hz */
          #define EHOP 44              /* un point d'enveloppe toutes les 1 ms */
          #define ERING 1024
          #define EMASK (ERING - 1)
          #ifndef THR
          #define THR 0.30f            /* seuil de correlation sur l'onde */
          #endif
          #ifndef ETHR
          #define ETHR 0.55f           /* seuil de l'etape 1 (enveloppe) */
          #endif
          #ifndef EONLY
          #define EONLY 0.95f          /* repli : enveloppe seule tres bonne */
          #endif
          #define COOL 1300            /* repos apres detection, en ms */
          #define SCAN 441             /* etape 2 : on cherche le pic sur les 10 derniers ms */

          volatile int bysgDetOn = 1;
          #ifdef TESTDBG
          float dbgmax[NT];
          #endif
          static float ring[RING];
          static unsigned wpos;
          static float erg[ERING];
          static unsigned ewpos;
          static int sinceE;
          static float *tpl[NT], *tenv[NT];
          static int tn[NT], ten[NT], tms[NT], toff[NT];
          static double tnorm[NT], tenorm[NT];
          static float best[NT];
          static int age[NT], armed[NT], cool[NT];
          static volatile float sens = 1.0f;   /* multiplicateur de seuil : <1 = plus sensible */
          static volatile float ksens[NT] = {1.0f, 0.8f, 0.75f, 1.0f};   /* en plus : pièce et mort un peu plus sensibles (sons noyés dans la musique / les bruitages) */
          static int inited;
          static float stE[NT], stW[NT];
          void bysgDetStats(float *e, float *w) {
            for (int k = 0; k < 3; k++) { e[k] = stE[k]; w[k] = stW[k]; }
            if (stE[3] > e[0]) e[0] = stE[3];
            if (stW[3] > w[0]) w[0] = stW[3];
            for (int k = 0; k < NT; k++) stE[k] = stW[k] = 0;
          }

          void bysgDetSetSens(float k) { if (k < 0.3f) k = 0.3f; if (k > 3.0f) k = 3.0f; sens = k; }
          void bysgDetSetSensK(int kind, float k) {
            if (k < 0.3f) k = 0.3f; if (k > 3.0f) k = 3.0f;
            if (kind < 0 || kind > 2) return;
            ksens[kind] = k; if (kind == 0) ksens[3] = k;
          }

          static int b64dec(const char *s, uint8_t *out) {
            static int ready = 0; static signed char t[256];
            if (!ready) {
              memset(t, -1, sizeof t);
              const char *a = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";
              for (int i = 0; i < 64; i++) t[(unsigned char)a[i]] = (signed char)i;
              ready = 1;
            }
            int n = 0; uint32_t v = 0; int bits = 0;
            for (; *s; s++) {
              int d = t[(unsigned char)*s]; if (d < 0) continue;
              v = (v << 6) | (uint32_t)d; bits += 6;
              if (bits >= 8) { bits -= 8; out[n++] = (uint8_t)((v >> bits) & 0xFF); }
            }
            return n;
          }

          static float *loadArr(const char *b64, int n, double *norm, int scale) {
            uint8_t *raw = (uint8_t *)malloc((size_t)n * 2 + 8);
            b64dec(b64, raw);
            float *a = (float *)malloc(sizeof(float) * (size_t)n);
            double m = 0;
            for (int i = 0; i < n; i++) { int16_t s = (int16_t)(raw[2 * i] | (raw[2 * i + 1] << 8)); a[i] = s / (scale ? 32768.0f : 30000.0f); m += a[i]; }
            m /= n;
            double e = 0;
            for (int i = 0; i < n; i++) { a[i] -= (float)m; e += (double)a[i] * a[i]; }
            *norm = sqrt(e);
            free(raw);
            return a;
          }

          void bysgDetInit(void) {
            if (inited) return;
            tn[0] = BYSG_SND_N0; tn[1] = BYSG_SND_N1; tn[2] = BYSG_SND_N2; tn[3] = BYSG_SND_N3;
            ten[0] = BYSG_ENV_N0; ten[1] = BYSG_ENV_N1; ten[2] = BYSG_ENV_N2; ten[3] = BYSG_ENV_N3;
            tms[0] = BYSG_SND_MS0; tms[1] = BYSG_SND_MS1; tms[2] = BYSG_SND_MS2; tms[3] = BYSG_SND_MS3;
            toff[0] = BYSG_SND_OFF0; toff[1] = BYSG_SND_OFF1; toff[2] = BYSG_SND_OFF2; toff[3] = BYSG_SND_OFF3;
            tpl[0] = loadArr(BYSG_SND_B0, tn[0], &tnorm[0], 1); tpl[1] = loadArr(BYSG_SND_B1, tn[1], &tnorm[1], 1);
            tpl[2] = loadArr(BYSG_SND_B2, tn[2], &tnorm[2], 1); tpl[3] = loadArr(BYSG_SND_B3, tn[3], &tnorm[3], 1);
            tenv[0] = loadArr(BYSG_ENV_B0, ten[0], &tenorm[0], 0); tenv[1] = loadArr(BYSG_ENV_B1, ten[1], &tenorm[1], 0);
            tenv[2] = loadArr(BYSG_ENV_B2, ten[2], &tenorm[2], 0); tenv[3] = loadArr(BYSG_ENV_B3, ten[3], &tenorm[3], 0);
            inited = 1;
          }

          /* etape 1 : correlation de l'enveloppe (1 point = 2 ms, pas de 2 points car l'enveloppe est calculee toutes les 1 ms) */
          static float envNcc(int k) {
            int n = ten[k];
            unsigned last = ewpos - 1u;
            double s = 0, s2 = 0, dot = 0;
            for (int i = 0; i < n; i++) {
              float x = erg[(last - (unsigned)((n - 1 - i) * 2)) & EMASK];
              s += x; s2 += (double)x * x; dot += (double)x * tenv[k][i];
            }
            double var = s2 - s * s / n;
            if (var < 1e-12) return 0.0f;
            return (float)(dot / (sqrt(var) * tenorm[k]));
          }

          /* etape 2 : correlation de l'onde, fin de fenetre = wpos-1-back (en echantillons a 44100 Hz) */
          static float waveNcc(int k, int back) {
            int n = tn[k];
            unsigned last = wpos - 1u - (unsigned)back;
            double s = 0, s2 = 0, dot = 0;
            for (int i = 0; i < n; i++) {
              float x = ring[(last - (unsigned)((n - 1 - i) * DEC)) & MASK];
              s += x; s2 += (double)x * x; dot += (double)x * tpl[k][i];
            }
            double var = s2 - s * s / n;
            if (var < 1e-7) return 0.0f;
            return (float)(dot / (sqrt(var) * tnorm[k]));
          }

          static void check(void) {
            for (int k = 0; k < NT; k++) {
              if (cool[k] > 0) { cool[k]--; continue; }
              if (ewpos < (unsigned)(ten[k] * 2 + 2) || wpos < (unsigned)(tn[k] * DEC + SCAN + 8)) continue;
              const float sn = sens * ksens[k];
              float e = envNcc(k);
              if (e > stE[k]) stE[k] = e;
              int go = 0;
              if (e >= ETHR * sn) {
                if (!armed[k]) { armed[k] = 1; best[k] = e; age[k] = 0; }
                else if (e > best[k]) { best[k] = e; age[k] = 0; }
                else age[k]++;
                if (age[k] >= 2) go = 1;
              } else if (armed[k]) go = 1;
              if (!go) continue;
              float be = best[k];
              armed[k] = 0;
              int bk = 0; float bs = -1.0f;                       /* recherche dense du pic d'onde */
              for (int back = 0; back < SCAN; back++) { float v = waveNcc(k, back); if (v > bs) { bs = v; bk = back; } }
          #ifdef TESTDBG
              if (bs > dbgmax[k]) dbgmax[k] = bs;
          #endif
              if (bs > stW[k]) stW[k] = bs;
              if (bs >= THR * sn || (be >= EONLY * sn && bs >= 0.5f * THR * sn)) {   /* onde reconnue, ou enveloppe quasi parfaite + onde partielle (son un peu deforme) */
                cool[k] = COOL;
                bysgOnHit(k == 3 ? 0 : k, (int)lround(toff[k] + tms[k] + bk * 1000.0 / 44100.0));
              } else cool[k] = 6;
            }
          }

          /* Filtre passe-bas (Butterworth 4e ordre, 3,8 kHz) puis reechantillonnage lineaire vers 44100 Hz */
          static double fs_cur, b0[2], b1[2], b2[2], a1[2], a2[2], z1[2], z2[2];
          static double prevY, nextOut, ratio, idx;
          static void design(double fs) {
            const double Q[2] = {0.5411961, 1.3065630};
            double w = 2.0 * M_PI * 3800.0 / fs, c = cos(w);
            for (int i = 0; i < 2; i++) {
              double al = sin(w) / (2.0 * Q[i]), a0 = 1.0 + al;
              b0[i] = ((1.0 - c) / 2.0) / a0; b1[i] = (1.0 - c) / a0; b2[i] = b0[i];
              a1[i] = (-2.0 * c) / a0; a2[i] = (1.0 - al) / a0; z1[i] = z2[i] = 0;
            }
            fs_cur = fs; ratio = fs / 44100.0; nextOut = 0; idx = 0; prevY = 0;
          }

          void bysgDetFeed(const float *mono, int n, double rate) {
            if (!inited || !bysgDetOn || rate < 8000) return;
            if (fabs(rate - fs_cur) > 1.0) design(rate);
            for (int i = 0; i < n; i++) {
              double y = mono[i];
              for (int s = 0; s < 2; s++) {          /* forme directe transposee II */
                double o = b0[s] * y + z1[s];
                z1[s] = b1[s] * y - a1[s] * o + z2[s];
                z2[s] = b2[s] * y - a2[s] * o;
                y = o;
              }
              idx += 1.0;
              while (nextOut <= idx) {
                double fr = nextOut - (idx - 1.0);
                if (fr < 0) fr = 0;
                ring[wpos++ & MASK] = (float)(prevY + (y - prevY) * fr);
                nextOut += ratio;
                if (++sinceE >= EHOP) {                /* tous les 1 ms : point d'enveloppe + controle */
                  sinceE = 0;
                  double e2 = 0;
                  for (int j = 1; j <= EBLK; j++) { float v = ring[(wpos - (unsigned)j) & MASK]; e2 += (double)v * v; }
                  erg[ewpos++ & EMASK] = (float)sqrt(e2 / EBLK);
                  check();
                }
              }
              prevY = y;
            }
          }
          BYSG_SRC_END
      - name: Recuperer fishhook
        run: |
          for b in main master; do
            curl -fsSL -o fishhook.c "https://raw.githubusercontent.com/facebook/fishhook/$b/fishhook.c" && curl -fsSL -o fishhook.h "https://raw.githubusercontent.com/facebook/fishhook/$b/fishhook.h" && break
          done
          test -s fishhook.c && test -s fishhook.h
      - name: Compiler le dylib
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -arch arm64 -isysroot "$SDK" -miphoneos-version-min=14.0 -fobjc-arc -O3 -fvisibility=hidden -dynamiclib -framework UIKit -framework WebKit -framework PhotosUI -framework AVFoundation -framework Foundation -framework CoreGraphics -framework SpriteKit -framework AudioToolbox -framework QuartzCore -framework GameController -install_name @rpath/BYSG.dylib -o BYSG.dylib BYSG.m LuckySpeeder.c LuckySpeeder.m hwbphook.c port_clock_gettime.c mach_excServer.c bysg_det.c fishhook.c
          strip -x BYSG.dylib
          codesign -f -s - BYSG.dylib
      - uses: actions/upload-artifact@v4
        with:
          name: BYSG-dylib
          path: BYSG.dylib
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: BYSG dylib
          files: BYSG.dylib
