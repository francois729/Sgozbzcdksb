          // ---------- Chrono automatique : detection des sons du jeu (intro = start, piece / mort = stop) ----------
          // On enveloppe le render callback AudioUnit du jeu (FMOD / Unity) et on analyse le son qui sort, sans micro.
          static void bysgBoostSetRun(BOOL r, CFTimeInterval tDet);
          static void bysgAQTrigger(CFTimeInterval tDet);
          static CFTimeInterval gStopGuardUntil = 0;     // pas d'arret du chrono pendant / juste apres la rafale de boosts
          static NSString *gHudEv; static CFTimeInterval gHudEvT;
          static CFTimeInterval gLastStartT = -100;
          void bysgOnHit(int kind, int lagMs) {
            const CFTimeInterval tDet = CACurrentMediaTime();    // instant exact de la detection (thread audio)
            dispatch_async(dispatch_get_main_queue(), ^{
              CFTimeInterval now = CACurrentMediaTime();
              if (kind != 0 && now < gStopGuardUntil) return;      // son parasite des boosts : on ne coupe pas le chrono
              int lagTot = lagMs + (int)lround(MAX(0.0, now - tDet) * 1000.0);   // + temps perdu avant d'arriver ici (jeu qui charge)
              static const char *nm[3] = {"intro", "pièce", "mort"};
              if (kind == 0) {
                if (now - gLastStartT < 4.0) return;            // meme intro entendue deux fois : un seul depart
                gLastStartT = now;
                bysgBoostSetRun(YES, tDet);                      // Auto Boost : rafale au depart de la partie
              }
              if (kind == 2) bysgAQTrigger(tDet);                // Auto Quit : a la mort, appuie sur les carres 1, 2, 3 pour quitter la partie
              gHudEv = [NSString stringWithFormat:@"%s → %s (%d ms)", nm[kind], kind == 0 ? "START" : "STOP", lagTot]; gHudEvT = now;
              if (!host) return;
              NSString *js = [NSString stringWithFormat:@"window.autoChrono&&autoChrono('%s',%d,%d)", kind == 0 ? "start" : "stop", lagTot, kind];
              [host.web evaluateJavaScript:js completionHandler:nil];
            });
          }

          typedef struct { AURenderCallback cb; void *ref; AudioUnit unit; AudioStreamBasicDescription f; int ok; } BYSGWrap;

          static void bysgFeed(AudioBufferList *io, UInt32 n, const AudioStreamBasicDescription *f) {
            BOOL fl = (f->mFormatFlags & kAudioFormatFlagIsFloat) != 0;
            BOOL ni = (f->mFormatFlags & kAudioFormatFlagIsNonInterleaved) != 0;
            UInt32 ch = f->mChannelsPerFrame, bits = f->mBitsPerChannel;
            if (!ch || !io || io->mNumberBuffers < 1) return;
            if (!fl && bits != 16 && bits != 32) return;
            UInt32 bpf = ni ? bits / 8 : f->mBytesPerFrame;
            if (!bpf || !io->mBuffers[0].mData) return;
            UInt32 avail = io->mBuffers[0].mDataByteSize / bpf;
            if (n > avail) n = avail;
            float tmp[512];
            for (UInt32 off = 0; off < n; off += 512) {
              UInt32 m = MIN(512u, n - off);
              for (UInt32 i = 0; i < m; i++) {
                float s = 0; UInt32 used = 0;
                for (UInt32 c = 0; c < ch; c++) {
                  const void *d; UInt32 idx;
                  if (ni) { if (c >= io->mNumberBuffers || !io->mBuffers[c].mData) continue; d = io->mBuffers[c].mData; idx = off + i; }
                  else { d = io->mBuffers[0].mData; idx = (off + i) * ch + c; }
                  s += fl ? ((const float *)d)[idx] : (bits == 16 ? ((const int16_t *)d)[idx] / 32768.0f : ((const int32_t *)d)[idx] / 2147483648.0f);
                  used++;
                }
                tmp[i] = used ? s / used : 0;
              }
              bysgDetFeed(tmp, m, f->mSampleRate);
            }
          }

          static OSStatus bysgWrapCb(void *ref, AudioUnitRenderActionFlags *fl, const AudioTimeStamp *ts, UInt32 bus, UInt32 n, AudioBufferList *io) {
            BYSGWrap *w = (BYSGWrap *)ref;
            OSStatus r = w->cb(w->ref, fl, ts, bus, n, io);
            if (r != noErr || !io || (*fl & kAudioUnitRenderAction_OutputIsSilence)) return r;
            if (!w->ok) {
              UInt32 sz = sizeof(w->f);
              if (AudioUnitGetProperty(w->unit, kAudioUnitProperty_StreamFormat, kAudioUnitScope_Input, 0, &w->f, &sz) == noErr
                  && w->f.mSampleRate > 0 && w->f.mFormatID == kAudioFormatLinearPCM) w->ok = 1;
              else return r;
            }
            bysgFeed(io, n, &w->f);
            return r;
          }

          static OSStatus (*o_ausp)(AudioUnit, AudioUnitPropertyID, AudioUnitScope, AudioUnitElement, const void *, UInt32);
          static OSStatus h_ausp(AudioUnit u, AudioUnitPropertyID pid, AudioUnitScope sc, AudioUnitElement el, const void *data, UInt32 sz) {
            if (pid == kAudioUnitProperty_SetRenderCallback && data && sz >= sizeof(AURenderCallbackStruct)) {
              const AURenderCallbackStruct *c = (const AURenderCallbackStruct *)data;
              if (c->inputProc && c->inputProc != bysgWrapCb) {
                BYSGWrap *w = (BYSGWrap *)calloc(1, sizeof(BYSGWrap));
                w->cb = c->inputProc; w->ref = c->inputProcRefCon; w->unit = u;
                AURenderCallbackStruct n = { bysgWrapCb, w };
                return o_ausp(u, pid, sc, el, &n, sizeof(n));
              }
            }
            return o_ausp(u, pid, sc, el, data, sz);
          }
          static void bysgInstallAudio(void) {
