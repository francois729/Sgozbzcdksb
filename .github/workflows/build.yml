      - name: Decoder chrono.html
        run: |
          python3 - <<'PYX'
          import base64, zlib
          s = ''.join(open('chrono.b64').read().split())
          d = zlib.decompress(base64.b64decode(s))
          open('chrono.html', 'wb').write(d)
          print('chrono.html', len(d), 'octets')
          PYX
      - name: Ecrire BYSG.m
        run: |
          cat > BYSG.m <<'BYSG_M_END'
          // BYSG overlay : WKWebView transparent qui ne capte les touches QUE sur le timer
          #import <UIKit/UIKit.h>
          #import <WebKit/WebKit.h>
          #import <PhotosUI/PhotosUI.h>
          #import <AVFoundation/AVFoundation.h>
          #import <objc/runtime.h>
          #include <mach/mach_time.h>
          #include <time.h>
          #include <fcntl.h>
          #include <sys/stat.h>
          #include <stdarg.h>
          #include <unistd.h>
          #include "fishhook.h"
          #include "chrono_html.h"
          #include "LuckySpeederWrap.h"
          #include <AudioToolbox/AudioToolbox.h>
          #include "bysg_det.h"
          #import <QuartzCore/QuartzCore.h>
          #import <GameController/GameController.h>
          #import <objc/runtime.h>

          static BOOL gStretch = NO, gGray = NO;
          static int gKbChordMs = 30;          // fenetre d'accord (ms) : les touches pressees dans ce delai glissent ensemble (mode Simultane)
          static BOOL gKbLogOn = NO;           // journal des doigts virtuels
          static int gKbSim = 0;               // 0 : les mouvements s'enchainent image par image (le jeu lit un glissement a la fois) ; 1 : doigts simultanes
          static int gAA = 1;                // Anti-aliasing par suréchantillonnage : 1, 2 ou 4
          static int gQual = 2;               // Graphics Quality : 0 Low, 1 Mid, 2 High
          static CGFloat gSat = 1.0, gSatB = 1.0;
          static CGFloat gPct = 1.0, gRW = 1440, gRH = 1080;
          static UIView *grayView;
          static BOOL gGmOn = NO;            // Pack graphique : matrice de couleurs envoyee par l'interface
          static float gGm[20];
          static int gGmVer = 0;
          static NSDictionary *bysgMapInfo(NSString *sel);   // defini plus bas
          static NSString *bysgMapDir(NSString *name);       // defini plus bas
          static void bysgRestartSoon(void);                 // defini plus bas

          // ---------- Vitesse du jeu (speed hack LuckySpeeder, licence MIT) ----------
          // 5 méthodes : 0 Unity timeScale, 1 gettimeofday, 2 clock_gettime, 3 mach_absolute_time, 4 SpriteKit
          static int gMode = 3;
          static double gSpd = 1.0;
          static BOOL gHooked = NO;
          static void bysgApplySpeed(WKWebView *web) {
            if (gHooked && (int)currentMod != gMode) { resetHook(); gHooked = NO; }
            if (!gHooked && gSpd == 1.0) return;
            currentMod = (enum SpeedMode)gMode;
            if (!gHooked) {
              BOOL ok = (initHook() == HOOK_SUCCESS);
              [web evaluateJavaScript:[NSString stringWithFormat:@"window.spf&&spf(%d)", ok ? 1 : 0] completionHandler:nil];
              if (!ok) return;
              gHooked = YES;
            }
            updateSpeed((float)gSpd);
          }

          // ---------- Résolution étirée ----------
          // Façon PC : on choisit une résolution (ex. 1440x1080), elle est adaptée aux pixels réels du téléphone
          // (jamais plus grande que l'écran, orientation respectée), le jeu est rendu dans cette résolution puis étiré plein écran.
          // Le curseur va de 0 % (écran normal) à 100 % (résolution choisie).
          static void bysgStretch(UIWindow *w) {
            UIView *gv = w.rootViewController.view;
            if (!gv) return;
            CGSize sb = w.bounds.size;
            CGFloat sc = UIScreen.mainScreen.nativeScale, tw = sb.width, th = sb.height;
            if (gStretch && gPct >= 0.01) {
              CGFloat spw = sb.width * sc, sph = sb.height * sc;
              CGFloat lg = MAX(gRW, gRH), sh = MIN(gRW, gRH);
              CGFloat k = MIN(1.0, MIN(MAX(spw, sph) / lg, MIN(spw, sph) / sh));
              BOOL land = sb.width > sb.height;
              CGFloat rw = (land ? lg : sh) * k, rh = (land ? sh : lg) * k;
              tw = (spw + (rw - spw) * gPct) / sc;
              th = (sph + (rh - sph) * gPct) / sc;
            }
            if (gQual == 3) { tw = floor(tw * 1.25); th = floor(th * 1.25); }   // Ultra : rendu 1,25 fois plus grand puis réduit
            if (gAA > 1) { CGFloat af = sqrt((double)gAA); tw = floor(tw * af); th = floor(th * af); }   // anti-aliasing x2 / x4
            if (gQual < 2) { CGFloat qf = (gQual == 0) ? 0.5 : 0.75; tw = floor(tw * qf); th = floor(th * qf); }   // Graphics Quality : le jeu est rendu plus petit puis etire plein ecran
            if (fabs(tw - sb.width) < 0.5 && fabs(th - sb.height) < 0.5) {
              if (!CGAffineTransformIsIdentity(gv.transform)) { gv.transform = CGAffineTransformIdentity; gv.frame = w.bounds; }
              return;
            }
            if (fabs(gv.bounds.size.width - tw) < 0.5 && fabs(gv.bounds.size.height - th) < 0.5 && !CGAffineTransformIsIdentity(gv.transform)) return;
            gv.transform = CGAffineTransformIdentity;
            gv.bounds = CGRectMake(0, 0, tw, th);
            gv.center = CGPointMake(sb.width / 2, sb.height / 2);
            gv.transform = CGAffineTransformMakeScale(sb.width / tw, sb.height / th);
          }

          // ---------- Noir et blanc ----------
          // Une vue blanche en mode de fusion "saturation" posée au-dessus du jeu (sous le timer, qui garde ses couleurs)
          // ---------- Saturation (0 à 300 %) : filtre sur la vue du jeu, le timer garde ses couleurs ----------
          static void bysgSat(UIWindow *w) {
            Class cf = NSClassFromString(@"CAFilter");
            UIView *rv = w.rootViewController.view;
            if (!cf || !rv) return;
            static CGFloat applied = 1.0;
            static int appliedGm = 0;
            BOOL wantSat = fabs(gSat - 1.0) > 0.001;
            if (!wantSat && !gGmOn) { if (rv.layer.filters.count) rv.layer.filters = nil; applied = 1.0; appliedGm = gGmVer; return; }
            if (fabs(applied - gSat) < 0.0005 && appliedGm == gGmVer && rv.layer.filters.count) return;
            SEL sel = NSSelectorFromString(@"filterWithType:");
            if (![cf respondsToSelector:sel]) return;
            NSMutableArray *fs = [NSMutableArray array];
          #pragma clang diagnostic push
          #pragma clang diagnostic ignored "-Warc-performSelector-leaks"
            if (wantSat) {
              id f = [cf performSelector:sel withObject:@"colorSaturate"];
              if (f) { [f setValue:@(gSat) forKey:@"inputAmount"]; [fs addObject:f]; }
            }
            if (gGmOn) {                                   // Pack graphique : contraste / couleurs / teinte (matrice 4x5)
              id f = [cf performSelector:sel withObject:@"colorMatrix"];
              if (f) {
                NSValue *mv = [NSValue valueWithBytes:gGm objCType:"{CAColorMatrix=ffffffffffffffffffff}"];
                [f setValue:mv forKey:@"inputColorMatrix"];
                [fs addObject:f];
              }
            }
          #pragma clang diagnostic pop
            if (!fs.count) return;
            rv.layer.filters = fs;
            applied = gSat; appliedGm = gGmVer;
          }

          static void bysgGray(UIWindow *w) {
            bysgSat(w);
            if (!gGray && gSatB >= 0.999) { if (grayView.superview) [grayView removeFromSuperview]; return; }
            if (!grayView) {
              grayView = [[UIView alloc] initWithFrame:w.bounds];
              grayView.userInteractionEnabled = NO;
              grayView.backgroundColor = UIColor.whiteColor;
              grayView.layer.compositingFilter = @"saturationBlendMode";
              grayView.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
            }
            if (grayView.superview != w) [w addSubview:grayView];
            grayView.frame = w.bounds;
            grayView.alpha = gGray ? 1.0 : (1.0 - gSatB);
          }

          static UIViewController *topVC(UIWindow *w) {
            UIViewController *v = w.rootViewController;
            while (v.presentedViewController) v = v.presentedViewController;
            return v;
          }

          // ---------- Compteur FPS : on compte les images rendues par le jeu (Metal) ----------
          static volatile int gFr;
          static IMP o_nd;
          static id h_nd(id s, SEL c) { __atomic_fetch_add(&gFr, 1, __ATOMIC_RELAXED); return ((id (*)(id, SEL))o_nd)(s, c); }
          static void bysgInstallFps(void) {
            Class k = NSClassFromString(@"CAMetalLayer");
            Method m = k ? class_getInstanceMethod(k, NSSelectorFromString(@"nextDrawable")) : NULL;
            if (m && !o_nd) { o_nd = method_getImplementation(m); method_setImplementation(m, (IMP)h_nd); }
          }

          // declarations anticipees (Auto Boost / detection) utilisees par le gestionnaire de messages
          static BOOL gABEnabled, gABAuto, gABDbg;
          static void bysgMcConfig(BOOL on, int dirs, int mode, int spd, int dist, NSArray *seq);   // Macro (defini plus bas)
          static BOOL gAQEnabled, gAQEdit;                 // Auto Quit (defini plus bas)
          static int gAQN, gAQDelay, gAQGap;
          static void bysgAQStartEdit(void);
          static void bysgAQTest(void);
          static void bysgKbConfig(BOOL on, int dist, int mode);   // Clavier (defini plus bas)
          static __weak WKWebView *gKbWeb = nil;            // vue web de l'overlay (pour afficher les touches maintenues)
          static int gKbMaskSent = -1;
          static int gBoostSpd, gABN, gABDelay;
          static BOOL gForceFps;
          static void bysgBoostStartEdit(void);
          static void bysgBoostTest(void);
          static void bysgApplyAllFps(void);
          @interface BYSGHost : UIView <WKScriptMessageHandler, UIScrollViewDelegate, PHPickerViewControllerDelegate>
          @property(nonatomic, strong) NSArray<NSValue *> *holes;
          @property(nonatomic, strong) WKWebView *web;
          @property(nonatomic) BOOL pickOv;
          @end

          @implementation BYSGHost
          - (instancetype)initWithFrame:(CGRect)f {
            if ((self = [super initWithFrame:f])) {
              self.backgroundColor = UIColor.clearColor;
              self.autoresizingMask = UIViewAutoresizingFlexibleWidth | UIViewAutoresizingFlexibleHeight;
              WKWebViewConfiguration *cfg = [WKWebViewConfiguration new];
          cfg.allowsInlineMediaPlayback = YES;
          cfg.mediaTypesRequiringUserActionForPlayback = WKAudiovisualMediaTypeNone;
              [cfg.userContentController addScriptMessageHandler:self name:@"r"];
              [cfg.userContentController addScriptMessageHandler:self name:@"n"];
              NSString *savedS = [NSUserDefaults.standardUserDefaults stringForKey:@"bysgS"];
              if (savedS.length) {
                NSData *jd = [NSJSONSerialization dataWithJSONObject:@[savedS] options:0 error:nil];
                NSString *arr = jd ? [[NSString alloc] initWithData:jd encoding:NSUTF8StringEncoding] : nil;
                if (arr) [cfg.userContentController addUserScript:[[WKUserScript alloc] initWithSource:[NSString stringWithFormat:@"window.__BYSG_SAVED=(%@)[0];", arr] injectionTime:WKUserScriptInjectionTimeAtDocumentStart forMainFrameOnly:YES]];
              }
              self.web = [[WKWebView alloc] initWithFrame:self.bounds configuration:cfg];
              self.web.autoresizingMask = self.autoresizingMask;
              self.web.opaque = NO;
              self.web.backgroundColor = UIColor.clearColor;
              self.web.scrollView.backgroundColor = UIColor.clearColor;
              self.web.scrollView.scrollEnabled = NO;
              self.web.scrollView.delegate = self;
              self.web.scrollView.contentInsetAdjustmentBehavior = UIScrollViewContentInsetAdjustmentNever;
              [self addSubview:self.web];
              [self.web loadHTMLString:bysgChrono()
                               baseURL:[NSURL URLWithString:@"https://bysg.local/"]];
            }
            return self;
          }
          // Hors du timer : on renvoie nil => la touche passe au jeu (plus de carré invisible)
          - (UIView *)hitTest:(CGPoint)p withEvent:(UIEvent *)e {
            for (NSValue *v in self.holes)
              if (CGRectContainsPoint(CGRectInset(v.CGRectValue, -4, -4), p)) return [super hitTest:p withEvent:e];
            return nil;
          }
          // Sélecteur de photo natif (PHPicker, aucune permission requise)
          - (void)pickPhoto {
            UIWindow *w = self.window;
            if (!w) return;
            PHPickerConfiguration *c = [[PHPickerConfiguration alloc] init];
            c.filter = [PHPickerFilter imagesFilter];
            c.selectionLimit = 1;
            PHPickerViewController *p = [[PHPickerViewController alloc] initWithConfiguration:c];
            p.delegate = self;
            self.hidden = YES; // l'overlay ne doit pas couvrir le sélecteur
            [topVC(w) presentViewController:p animated:YES completion:nil];
          }
          - (void)picker:(PHPickerViewController *)picker didFinishPicking:(NSArray<PHPickerResult *> *)results {
            [picker dismissViewControllerAnimated:YES completion:nil];
            self.hidden = NO;
            PHPickerResult *r = results.firstObject;
            if (!r || ![r.itemProvider canLoadObjectOfClass:UIImage.class]) return;
            __weak BYSGHost *ws = self;
            [r.itemProvider loadObjectOfClass:UIImage.class completionHandler:^(id<NSItemProviderReading> obj, NSError *err) {
              UIImage *im = (UIImage *)obj;
              if (![im isKindOfClass:UIImage.class]) return;
              BOOL ov = ws.pickOv;
              CGFloat k = MIN(1.0, (ov ? 700.0 : 900.0) / MAX(im.size.width, im.size.height));
              CGSize ns = CGSizeMake(floor(im.size.width * k), floor(im.size.height * k));
              UIGraphicsImageRendererFormat *fmt = [UIGraphicsImageRendererFormat defaultFormat];
              fmt.scale = 1;
              fmt.opaque = !ov;
              UIImage *sm = [[[UIGraphicsImageRenderer alloc] initWithSize:ns format:fmt] imageWithActions:^(UIGraphicsImageRendererContext *ctx) {
                [im drawInRect:CGRectMake(0, 0, ns.width, ns.height)];
              }];
              NSData *d = nil;
              NSString *mime = @"image/jpeg";
              if (ov) { d = UIImagePNGRepresentation(sm); mime = @"image/png"; if (d.length > 1500000) d = nil; } // PNG : garde la transparence
              if (!d) { d = UIImageJPEGRepresentation(sm, ov ? 0.88 : 0.82); mime = @"image/jpeg"; }
              if (!d) return;
              NSString *js = [NSString stringWithFormat:@"%@('data:%@;base64,%@')", ov ? @"setOv" : @"setBg", mime, [d base64EncodedStringWithOptions:0]];
              dispatch_async(dispatch_get_main_queue(), ^{ [ws.web evaluateJavaScript:js completionHandler:nil]; });
            }];
          }
          - (void)userContentController:(WKUserContentController *)c didReceiveScriptMessage:(WKScriptMessage *)m {
            if ([m.name isEqualToString:@"n"]) {
              NSDictionary *d = m.body;
              if (![d isKindOfClass:NSDictionary.class]) return;
              if (d[@"st"] != nil) { NSString *js = d[@"st"]; if ([js isKindOfClass:NSString.class] && js.length < 400000) [NSUserDefaults.standardUserDefaults setObject:js forKey:@"bysgS"]; return; }
              if (d[@"ab"] != nil) {
                NSArray *a = d[@"ab"];
                if ([a isKindOfClass:NSArray.class] && a.count >= 5) {
                  gABEnabled = [a[0] intValue] != 0;
                  int nb = [a[1] intValue]; gABN = nb < 2 ? 2 : (nb > 3 ? 3 : nb);
                  int sp = [a[2] intValue]; gBoostSpd = sp < 0 ? 0 : (sp > 2 ? 2 : sp);
                  gABDbg = [a[3] intValue] != 0;
                  int dl = [a[4] intValue]; gABDelay = dl < 0 ? 0 : (dl > 5000 ? 5000 : dl);
                }
                return;
              }
          if (d[@"map"] != nil) {                           // Map : nom du dossier dans Documents/BYSG_maps (vide = original)
            NSString *s = [d[@"map"] isKindOfClass:NSString.class] ? d[@"map"] : @"";
            NSCharacterSet *bad = [[NSCharacterSet characterSetWithCharactersInString:@"abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_-. "] invertedSet];
            if (s.length > 48 || [s rangeOfCharacterFromSet:bad].location != NSNotFound || [s containsString:@".."] || [s hasPrefix:@"."]) s = @"";
            NSString *oldMap = [NSUserDefaults.standardUserDefaults stringForKey:@"bysgMap"] ?: @"";
            [NSUserDefaults.standardUserDefaults setObject:s forKey:@"bysgMap"];
            if ([d[@"rs"] intValue] && ![oldMap isEqualToString:s] && (!s.length || bysgMapDir(s))) bysgRestartSoon();   // redemarrage auto
            NSData *j = [NSJSONSerialization dataWithJSONObject:bysgMapInfo(s) options:0 error:nil];
            if (j) [self.web evaluateJavaScript:[NSString stringWithFormat:@"window.mpr&&mpr(%@)", [[NSString alloc] initWithData:j encoding:NSUTF8StringEncoding]] completionHandler:nil];
            return;
          }
          if (d[@"tm"] != nil) {                           // TrainingMode : mode choisi (memorise)
            NSString *m = [d[@"tm"] isKindOfClass:NSString.class] ? d[@"tm"] : @"";
            if (m.length > 40) m = @"";
            [NSUserDefaults.standardUserDefaults setObject:m forKey:@"bysgTrainingMode"];
            return;
          }
          if (d[@"mapq"] != nil) {
            NSData *j = [NSJSONSerialization dataWithJSONObject:bysgMapInfo([NSUserDefaults.standardUserDefaults stringForKey:@"bysgMap"]) options:0 error:nil];
            if (j) [self.web evaluateJavaScript:[NSString stringWithFormat:@"window.mpr&&mpr(%@)", [[NSString alloc] initWithData:j encoding:NSUTF8StringEncoding]] completionHandler:nil];
            return;
          }
              if (d[@"fm"] != nil) { gForceFps = [d[@"fm"] intValue] != 0; if (gForceFps) dispatch_async(dispatch_get_main_queue(), ^{ bysgApplyAllFps(); }); return; }
              if (d[@"aq"] != nil) {                           // Auto Quit : [actif, nombre de boutons, delai apres la mort (ms), pause entre les appuis (ms)]
                NSArray *a = [d[@"aq"] isKindOfClass:NSArray.class] ? d[@"aq"] : nil;
                if (a.count >= 4) {
                  gAQEnabled = [a[0] intValue] != 0;
                  int nb = [a[1] intValue]; gAQN = nb < 1 ? 1 : (nb > 3 ? 3 : nb);
                  int dl = [a[2] intValue]; gAQDelay = dl < 0 ? 0 : (dl > 5000 ? 5000 : dl);
                  int gp = [a[3] intValue]; gAQGap = gp < 100 ? 100 : (gp > 2000 ? 2000 : gp);
                }
