          /* dossier de la map : Data/<nom> du jeu, BYSG_maps/<nom> du jeu, ou Documents/BYSG_maps/<nom> */
          static NSString *bysgMapDir(NSString *name) {
            if (!name.length) return nil;
            NSFileManager *fm = NSFileManager.defaultManager;
            NSString *app = NSBundle.mainBundle.bundlePath;
            NSArray *c = @[ [[app stringByAppendingPathComponent:@"Data"] stringByAppendingPathComponent:name],
                            [[app stringByAppendingPathComponent:@"BYSG_maps"] stringByAppendingPathComponent:name],
                            [bysgMapRoot() stringByAppendingPathComponent:name] ];
            for (NSString *p in c) { BOOL d = NO; if ([fm fileExistsAtPath:p isDirectory:&d] && d) return p; }
            return nil;
          }
          /* Redemarrage auto : relance l'app toute seule (schema URL de l'app + LSApplicationWorkspace), puis quitte.
             Attend 1,2 s sans nouveau changement de map pour ne redemarrer qu'une fois. */
          static NSUInteger gRsGen = 0;
          static void bysgRestartSoon(void) {
            dispatch_async(dispatch_get_main_queue(), ^{
              NSUInteger my = ++gRsGen;
              dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(1.2 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
                if (my != gRsGen) return;
                NSBundle *b = NSBundle.mainBundle;
                NSString *bid = b.bundleIdentifier, *scheme = nil;
                for (NSDictionary *t in b.infoDictionary[@"CFBundleURLTypes"]) {
                  for (NSString *sc in t[@"CFBundleURLSchemes"]) if ([sc isKindOfClass:NSString.class] && sc.length) { scheme = sc; break; }
                  if (scheme) break;
                }
                if (scheme) {
                  NSURL *u = [NSURL URLWithString:[scheme stringByAppendingString:@"://bysg-restart"]];
                  if (u) [UIApplication.sharedApplication openURL:u options:@{} completionHandler:nil];
                }
                #pragma clang diagnostic push
                #pragma clang diagnostic ignored "-Warc-performSelector-leaks"
                Class W = NSClassFromString(@"LSApplicationWorkspace");
                SEL dw = NSSelectorFromString(@"defaultWorkspace"), ob = NSSelectorFromString(@"openApplicationWithBundleID:");
                id ws = (W && [W respondsToSelector:dw]) ? [W performSelector:dw] : nil;
                if (ws && bid && [ws respondsToSelector:ob]) [ws performSelector:ob withObject:bid];
                #pragma clang diagnostic pop
                dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(0.6 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{ exit(0); });
              });
            });
          }
          static NSDictionary *bysgMapInfo(NSString *sel) {
            NSFileManager *fm = NSFileManager.defaultManager;
            NSString *root = bysgMapRoot();
            NSMutableArray *dirs = [NSMutableArray array];
            for (NSString *r in @[ root, [NSBundle.mainBundle.bundlePath stringByAppendingPathComponent:@"BYSG_maps"] ])
              for (NSString *n in [fm contentsOfDirectoryAtPath:r error:nil]) {
                BOOL d = NO;
                if ([fm fileExistsAtPath:[r stringByAppendingPathComponent:n] isDirectory:&d] && d && ![dirs containsObject:n]) [dirs addObject:n];
              }
            {   /* dossiers de map poses dans Data/ du jeu : ceux qui contiennent un fichier Unity (data.unity3d, .assets, .resource...) */
              NSString *dd = [NSBundle.mainBundle.bundlePath stringByAppendingPathComponent:@"Data"];
              for (NSString *n in [fm contentsOfDirectoryAtPath:dd error:nil]) {
                if ([@[ @"Managed", @"Raw", @"Resources" ] containsObject:n] || [dirs containsObject:n]) continue;
                NSString *sub = [dd stringByAppendingPathComponent:n]; BOOL d = NO;
                if (![fm fileExistsAtPath:sub isDirectory:&d] || !d) continue;
                for (NSString *f in [fm contentsOfDirectoryAtPath:sub error:nil]) {
                  NSString *e = f.pathExtension.lowercaseString;
                  if ([@[ @"unity3d", @"assets", @"resource", @"ress", @"bundle" ] containsObject:e]) { [dirs addObject:n]; break; }
                }
              }
            }
            int files = 0; BOOL ok = NO;
            if (sel.length) {
              NSString *p = bysgMapDir(sel);
              ok = p != nil;
              if (ok) for (NSString *f in [fm enumeratorAtPath:p]) { (void)f; files++; }
            }
            NSString *lg = [NSString stringWithContentsOfFile:[root stringByAppendingPathComponent:@"redirect_log.txt"] encoding:NSUTF8StringEncoding error:nil];
            if (lg.length > 2500) lg = [lg substringToIndex:2500];
            return @{ @"sel": sel ?: @"", @"ok": @(ok), @"files": @(files), @"dirs": dirs, @"log": @"" };
          }

          /* Changement de map : les fichiers de donnees du jeu (resources.assets, sharedassets, bundles...) sont
             lus depuis Documents/BYSG_maps/<map>/ quand ils y existent, sinon depuis l'original. Actif au prochain lancement. */
          static char gMapDir[1024];
          static __thread int tlMap;
          static int gMapLog = -1, gMapLogN = 0;
          static int (*o_open)(const char *, int, ...);
          static FILE *(*o_fopen)(const char *, const char *);
          static int (*o_stat)(const char *, struct stat *);
          static int (*o_access)(const char *, int);

          static int bysgMapFind(const char *p, char *out, size_t n) {
            if (!gMapDir[0] || !p || tlMap) return 0;
            tlMap = 1;
            int ok = 0; struct stat st;
            const char *k = strstr(p, "/Data/");
            if (k) {
              snprintf(out, n, "%s/%s", gMapDir, k + 6);
              ok = (o_stat ? o_stat(out, &st) : stat(out, &st)) == 0 && S_ISREG(st.st_mode);
            }
            if (!ok && strncmp(p, gMapDir, strlen(gMapDir)) != 0) {
              const char *b = strrchr(p, '/'); b = b ? b + 1 : p;
              if (strstr(b, ".assets") || strstr(b, ".resS") || strstr(b, ".bundle") || strstr(b, ".unity3d")) {
                snprintf(out, n, "%s/%s", gMapDir, b);
                ok = (o_stat ? o_stat(out, &st) : stat(out, &st)) == 0 && S_ISREG(st.st_mode);
              }
            }
            if (ok && gMapLog >= 0 && gMapLogN < 400) { gMapLogN++; dprintf(gMapLog, "%s\n  -> %s\n", p, out); }
            tlMap = 0;
            return ok;
          }
          static int h_open(const char *p, int fl, ...) {
            mode_t m = 0;
            if (fl & O_CREAT) { va_list a; va_start(a, fl); m = (mode_t)va_arg(a, int); va_end(a); }
            char b[1500];
            if ((fl & O_ACCMODE) == O_RDONLY && bysgMapFind(p, b, sizeof b)) p = b;
            return o_open(p, fl, m);
          }
          static FILE *h_fopen(const char *p, const char *mode) {
            char b[1500];
            if (mode && mode[0] == 'r' && !strchr(mode, '+') && bysgMapFind(p, b, sizeof b)) p = b;
            return o_fopen(p, mode);
          }
          static int h_stat(const char *p, struct stat *st) {
            char b[1500];
            if (bysgMapFind(p, b, sizeof b)) p = b;
            return o_stat(p, st);
          }
          static int h_access(const char *p, int md) {
            char b[1500];
            if (!(md & W_OK) && bysgMapFind(p, b, sizeof b)) p = b;
            return o_access(p, md);
          }
          static void bysgInstallMap(void) {
            NSString *root = bysgMapRoot();
            [NSFileManager.defaultManager createDirectoryAtPath:root withIntermediateDirectories:YES attributes:nil error:nil];
            NSString *sel = [NSUserDefaults.standardUserDefaults stringForKey:@"bysgMap"];
            if (!sel.length) return;
            NSString *p = bysgMapDir(sel);
