            strlcpy(gMapDir, p.fileSystemRepresentation, sizeof gMapDir);
            gMapLog = open([root stringByAppendingPathComponent:@"redirect_log.txt"].fileSystemRepresentation, O_WRONLY | O_CREAT | O_TRUNC, 0644);
            if (gMapLog >= 0) dprintf(gMapLog, "map=%s\n", gMapDir);
            struct rebinding rb[4] = {
              { "open", (void *)h_open, (void **)&o_open }, { "fopen", (void *)h_fopen, (void **)&o_fopen },
              { "stat", (void *)h_stat, (void **)&o_stat }, { "access", (void *)h_access, (void **)&o_access } };
            rebind_symbols(rb, 4);
          }

